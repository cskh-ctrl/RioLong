name: Render Rio Animation videos

on:
  push:
    branches: [main]
    paths: ['pipeline/trigger.txt']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - id: m
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # create the 6 releases (one per big folder) and skip videos that are already uploaded
          python3 - <<'EOF' > matrix.json
          import json, subprocess
          groups = json.load(open('pipeline/groups.json'))
          have = set()
          for tag, name in groups:
              r = subprocess.run(['gh', 'release', 'view', tag, '--json', 'assets', '-q', '.assets[].name'], capture_output=True, text=True)
              if r.returncode != 0:
                  subprocess.run(['gh', 'release', 'create', tag, '--title', name, '--notes', f'Thu muc {name}: moi file zip la 1 video (MP4, giong doc, phu de, kich ban, anh bia, thong tin dang YouTube).'], check=True, capture_output=True)
              else:
                  have |= set(r.stdout.split())
          only = open('pipeline/trigger.txt').read().split('ONLY:')[-1].strip() if 'ONLY:' in open('pipeline/trigger.txt').read() else ''
          only = set(only.split(',')) if only else None
          jobs = [j for j in json.load(open('pipeline/jobs.json')) if j['name'] + '.zip' not in have and (only is None or f"{j['kind']}_{j['n']}" in only)]
          print(json.dumps({'include': jobs}))
          EOF
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"
          echo "Jobs to render: $(python3 -c "import json;print(len(json.load(open('matrix.json'))['include']))")"

  render:
    needs: plan
    if: ${{ fromJson(needs.plan.outputs.matrix).include[0] != null }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    name: ${{ matrix.group }} / ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20 }
      - uses: actions/setup-python@v6
        with: { python-version: '3.11' }
      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: Kokoro voice model (cached)
        id: kc
        uses: actions/cache@v4
        with: { path: models, key: kokoro-v1.0 }
      - if: steps.kc.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          for f in kokoro-v1.0.onnx voices-v1.0.bin; do curl -sSL -o models/$f https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/$f; done
      - name: Python + Node deps
        run: |
          pip install -q kokoro-onnx soundfile numpy scipy
          cd studio && npm install --no-audit --no-fund && npx playwright install --with-deps chromium > /dev/null
      - name: Render ${{ matrix.kind }} ${{ matrix.n }}
        run: |
          set -o pipefail
          WORKERS=4 bash pipeline/run_one.sh ${{ matrix.kind }} ${{ matrix.n }} 2>&1 | tee render.log
      - name: Upload to release ${{ matrix.group }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ matrix.tag }} "dist/${{ matrix.name }}.zip" --clobber
      - name: Upload log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view logs > /dev/null 2>&1 || gh release create logs --title "logs" --notes "render logs" --prerelease
          cp render.log "fail_${{ matrix.kind }}_${{ matrix.n }}.log" || echo "no log" > "fail_${{ matrix.kind }}_${{ matrix.n }}.log"
          gh release upload logs "fail_${{ matrix.kind }}_${{ matrix.n }}.log" --clobber
      - name: Keep a preview contact sheet on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ matrix.kind }}-${{ matrix.n }}
          path: studio/projects/*/build/stills
          retention-days: 3
